name: CI/CD

# Pull requests: Rust tests, the web build with its browser tests and README media, an APK, desktop
# builds and the promo video (all downloadable as workflow artifacts).
# Push to main: the same, then publish a GitHub Release and deploy the web version.
# Push a v* tag: publish a release under that tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -yq libasound2-dev
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
      - name: Check the WebAssembly and Android targets
        run: |
          cargo check --locked --lib --target wasm32-unknown-unknown
          cargo check --locked --lib --target aarch64-linux-android

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (same version as in Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
      - run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: dist
          retention-days: 30

  browser-tests:
    name: Browser tests & README media
    needs: web
    runs-on: ubuntu-latest
    env:
      SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: dist
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers 2
      - name: Capture README screenshots and gameplay GIF
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          npm run screenshots
      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: |
            screenshots/*.png
            screenshots/*.gif
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  android:
    name: Android APK
    needs: rust
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      # ubuntu-latest ships the Android SDK (ANDROID_HOME) and NDK; Gradle fetches any missing platform.
      # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
      - name: Build the game library for every ABI
        run: cargo ndk --platform 26 -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --lib --release --locked
      - name: Decode release keystore (optional)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PskipCargo --no-daemon --stacktrace
      - name: Verify APK signature and contents
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libblock_baster.so'
          cp "$APK" block-baster.apk
      - uses: actions/upload-artifact@v5
        with:
          name: block-baster-apk
          path: block-baster.apk
          retention-days: 30

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, bin: block-baster }
          - { name: windows-x86_64, os: windows-latest, bin: block-baster.exe }
          - { name: macos-arm64, os: macos-latest, bin: block-baster }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libasound2-dev
      - run: cargo build --release --locked --bin block-baster
      - name: Package
        shell: bash
        run: |
          mkdir -p "block-baster-${{ matrix.name }}"
          cp "target/release/${{ matrix.bin }}" LICENSE "block-baster-${{ matrix.name }}/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "block-baster-${{ matrix.name }}.zip" "block-baster-${{ matrix.name }}" >/dev/null
          else
            tar czf "block-baster-${{ matrix.name }}.tar.gz" "block-baster-${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.name }}
          path: block-baster-${{ matrix.name }}.*
          retention-days: 30

  promo:
    name: Promo video
    needs: web
    runs-on: ubuntu-latest
    env:
      # The prebuilt FFmpeg that fframes downloads links against an older x264 than Ubuntu ships,
      # so build FFmpeg from source (cached with the rest of the Rust build below, per x264 version).
      FFMPEG_FORCE_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system packages
        id: system
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg libx264-dev nasm clang libasound2-dev
          echo "x264=$(dpkg-query -W -f='${Version}' libx264-dev)" >> "$GITHUB_OUTPUT"
      # FFmpeg built against one x264 doesn't link with another ("undefined symbol:
      # x264_encoder_open_164"), so a new x264 on the runner starts a fresh cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: x264-${{ steps.system.outputs.x264 }}
          workspaces: |
            . -> target
            promo -> target
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fresh footage from this commit's build, so the video always shows the current game.
      - name: Capture game footage
        run: node promo/capture/capture.mjs
      - name: Synthesise soundtrack
        run: |
          pip install numpy
          python3 promo/audio/music.py
      - name: Render video
        working-directory: promo
        run: cargo run --release -- render
      - name: Extract poster frame
        run: ffmpeg -y -loglevel error -ss 17.5 -i promo/block-baster-promo.mp4 -frames:v 1 -q:v 3 promo/promo-poster.jpg
      - uses: actions/upload-artifact@v5
        with:
          name: promo-video
          path: |
            promo/block-baster-promo.mp4
            promo/promo-poster.jpg
          retention-days: 30

  release:
    name: GitHub Release
    needs: [rust, browser-tests, android, desktop, promo]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: block-baster-apk
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: screenshots
      - uses: actions/download-artifact@v5
        with:
          name: promo-video
      - name: Pick release tag
        id: tag
        env:
          VERSION: ${{ needs.rust.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Block Baster $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=Block Baster $VERSION (build $GITHUB_RUN_NUMBER)" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          # The README embeds the media below via releases/latest/download/<file>.
          files: |
            block-baster.apk
            block-baster-*.tar.gz
            block-baster-*.zip
            showcase.png
            gameplay.gif
            screenshot-*.png
            block-baster-promo.mp4
            promo-poster.jpg
          make_latest: true
          generate_release_notes: true
          body: |
            **Android:** download `block-baster.apk` below, open it on your phone and allow installing apps from this source.

            **Desktop:** `block-baster-linux-x86_64.tar.gz`, `block-baster-windows-x86_64.zip` or `block-baster-macos-arm64.tar.gz`; unpack and run `block-baster`.

            **Promo video:** `block-baster-promo.mp4`, rendered from this build's real gameplay.

            Built from ${{ github.sha }}.

  deploy-web:
    name: Deploy web version
    needs: [rust, browser-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: dist
      - uses: actions/configure-pages@v5
      # Re-running a job keeps earlier attempts' artifacts, and deploy-pages fails when two
      # share a name, so every attempt uploads under its own name.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
