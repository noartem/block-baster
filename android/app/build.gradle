apply plugin: 'com.android.application'

// Version name comes from Cargo.toml so every build of the game shares one version.
def cargoVersion = (file('../../Cargo.toml').text =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1]
def env = System.getenv()
def hasReleaseKey = env.ANDROID_KEYSTORE_FILE && file(env.ANDROID_KEYSTORE_FILE).exists()

android {
    namespace = "io.github.noartem.blockbaster"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.noartem.blockbaster"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((env.VERSION_CODE ?: "1") as int)
        versionName cargoVersion
    }
    signingConfigs {
        // A fixed, public keystore so community builds can be installed over each other.
        // Official releases are signed with a private key provided through CI secrets.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile file(env.ANDROID_KEYSTORE_FILE)
                storePassword env.ANDROID_KEYSTORE_PASSWORD
                keyAlias env.ANDROID_KEY_ALIAS
                keyPassword env.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
    packagingOptions {
        // The library is already stripped of debug info by the release profile; keep it as is.
        jniLibs.useLegacyPackaging = false
    }
}

// Builds the game (Rust) for every Android ABI into src/main/jniLibs with cargo-ndk.
// Skip with -PskipCargo when the libraries were built beforehand (as CI does).
def abis = (project.findProperty('abis') ?: 'arm64-v8a,armeabi-v7a,x86_64').split(',')
tasks.register('cargoBuild', Exec) {
    workingDir file('../..')
    def args = ['cargo', 'ndk', '--platform', "${rootProject.ext.minSdkVersion}", '-o', 'android/app/src/main/jniLibs']
    abis.each { args += ['-t', it] }
    args += ['build', '--lib', '--release']
    commandLine args
}
if (!project.hasProperty('skipCargo')) {
    preBuild.dependsOn cargoBuild
}
